[project]
name = "ai-classroom-api"
version = "0.1.0"
description = "AI 老师课堂 · FastAPI 后端"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.125.0",
    "edge-tts>=7.2.8",
    "fastapi>=0.141.1",
    "httpx[socks]>=0.28.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
